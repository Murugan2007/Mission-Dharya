<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FlowSync{% endblock %}</title>
    <style>
        /* ─── FlowSync Dark Theme ─── */
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #1a1a2e;
            --bg-card-hover: #242444;
            --bg-input: #12122a;
            --accent: #00d4aa;
            --accent-dim: #00a88a;
            --warning: #ffb300;
            --danger: #ff4444;
            --success: #00d4aa;
            --text-primary: #e8e8f0;
            --text-secondary: #8888aa;
            --border: #2a2a4e;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─── Navbar ─── */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
        }
        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3em;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }
        .navbar-brand span { color: var(--text-primary); }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9em;
            transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--accent); }
        .role-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .role-public { background: #1a3a2e; color: var(--accent); }
        .role-operator { background: #3a2a1a; color: var(--warning); }

        /* ─── Main Content ─── */
        .main { flex: 1; padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }

        /* ─── Cards ─── */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            transition: border-color 0.3s;
        }
        .card:hover { border-color: var(--accent-dim); }
        .card-title {
            font-size: 0.85em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        /* ─── Junction Grid ─── */
        .junction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .junction-card { position: relative; }
        .junction-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .junction-id {
            font-size: 1.4em;
            font-weight: 700;
            color: var(--accent);
        }
        .junction-connector {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
        }
        .connector-line {
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-dim), var(--border));
            border-radius: 2px;
        }

        /* ─── Status Indicators ─── */
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-green { background: #00cc66; box-shadow: 0 0 6px #00cc6644; }
        .status-yellow { background: var(--warning); box-shadow: 0 0 6px #ffb30044; }
        .status-red { background: var(--danger); box-shadow: 0 0 6px #ff444444; }
        .status-grey { background: #555; }

        .signal-display {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .signal-light {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .signal-light.active-red { background: #ff3333; box-shadow: 0 0 10px #ff333388; border-color: #ff3333; }
        .signal-light.active-yellow { background: #ffcc00; box-shadow: 0 0 10px #ffcc0088; border-color: #ffcc00; }
        .signal-light.active-green { background: #00cc44; box-shadow: 0 0 10px #00cc4488; border-color: #00cc44; }
        .signal-light.inactive { background: #222; }

        .mode-badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 600;
        }
        .mode-adaptive { background: #1a3a2e; color: var(--accent); }
        .mode-fallback { background: #3a1a1a; color: var(--danger); }

        .queue-bar {
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .queue-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        /* ─── Warnings ─── */
        .warnings-container { margin-top: 24px; }
        .warning-card {
            background: #2a2200;
            border: 1px solid var(--warning);
            border-left: 4px solid var(--warning);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 12px;
            animation: slideIn 0.3s ease-out;
        }
        .warning-card.cancelled {
            opacity: 0.5;
            border-color: var(--border);
            background: var(--bg-card);
            animation: fadeOut 0.5s ease-out;
        }
        .warning-icon { font-size: 1.2em; margin-right: 8px; }
        .warning-text { font-size: 0.95em; line-height: 1.5; }
        .warning-meta {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        /* ─── Buttons ─── */
        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: var(--accent-dim); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-primary);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

        /* ─── Forms ─── */
        input, textarea, select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9em;
            width: 100%;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* ─── Chat (Operator LLM) ─── */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .chat-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.9em;
        }
        .chat-user {
            background: var(--accent-dim);
            color: #000;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chat-ai {
            background: var(--bg-card-hover);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .chat-tools {
            font-size: 0.8em;
            color: var(--text-secondary);
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid var(--border);
        }
        .chat-tool-call {
            background: var(--bg-input);
            padding: 6px 10px;
            border-radius: 6px;
            margin: 4px 0;
            font-family: monospace;
            font-size: 0.85em;
        }
        .chat-input-row {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--border);
        }
        .chat-input-row input { flex: 1; }
        .chat-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px 12px;
        }
        .suggestion-chip {
            padding: 4px 12px;
            background: var(--bg-card-hover);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 0.8em;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .suggestion-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* ─── Audit Log ─── */
        .audit-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85em;
        }
        .audit-table th {
            text-align: left;
            padding: 8px 12px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }
        .audit-table td {
            padding: 6px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }
        .audit-table tr:hover td { background: var(--bg-card-hover); }

        /* ─── Connection Status ─── */
        .connection-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        /* ─── Layout helpers ─── */
        .split-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 0.9em;
        }
        .detail-label { color: var(--text-secondary); }
        .detail-value { font-weight: 600; }

        .collapsible-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .collapsible-content { overflow: hidden; transition: max-height 0.3s; }
        .collapsible-content.collapsed { max-height: 0; padding: 0; }

        /* ─── Animations ─── */
        @keyframes slideIn {
            from { transform: translateX(20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0.4; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .pulse { animation: pulse 2s ease-in-out infinite; }

        /* ─── Footer ─── */
        .footer {
            padding: 16px 24px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8em;
            border-top: 1px solid var(--border);
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .split-layout { grid-template-columns: 1fr; }
            .junction-grid { grid-template-columns: 1fr; }
            .navbar { flex-direction: column; gap: 10px; }
        }

        /* ─── Markdown in chat ─── */
        .chat-ai strong { color: var(--accent); }
        .chat-ai code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        /* ─── EV Route Visual ─── */
        .ev-route {
            display: flex;
            align-items: center;
            gap: 0;
            padding: 16px 0;
        }
        .ev-junction-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65em;
            font-weight: 700;
            z-index: 1;
        }
        .ev-junction-dot.current {
            border-color: var(--warning);
            background: var(--warning);
            color: #000;
            box-shadow: 0 0 12px #ffb30066;
        }
        .ev-junction-dot.cleared {
            border-color: var(--accent);
            background: var(--accent);
            color: #000;
        }
        .ev-route-line {
            flex: 1;
            height: 3px;
            background: var(--border);
        }
        .ev-route-line.active { background: var(--warning); }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            🚦 Flow<span>Sync</span>
        </a>
        <div class="nav-links">
            {% block nav %}{% endblock %}
            <div class="connection-indicator" id="connectionStatus">
                <span class="status-dot status-grey" id="connDot"></span>
                <span id="connText">Connecting...</span>
            </div>
        </div>
    </nav>

    <div class="main">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        FlowSync — AI-Powered City Traffic Intelligence &amp; Coordination | PS 3
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
